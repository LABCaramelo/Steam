<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Biblioteca de prompts</title>
  <desc id="desc">Cartão de apresentação da biblioteca de prompts do Um Cara Caramelo. Duas fichas criativas se sobrepõem ao fundo preto com uma faixa laranja.</desc>
  <defs><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#101014" opacity=".17"/></pattern></defs>
  <rect width="920" height="430" fill="#101014"/>
  <path d="M701 0H920V430H523Z" fill="#ff701a"/>
  <path d="M839 0H920V430H671Z" fill="url(#dots)"/>
  <text x="43" y="48" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ff701a" letter-spacing="1.8">UM CARA CARAMELO / LAB 01</text>
  <path d="M43 67H458" stroke="#fff4e8" stroke-opacity=".2"/>
  <g font-family="Montserrat, Inter, Arial, sans-serif" font-size="49" font-weight="900" fill="#fff4e8" letter-spacing="-2">
    <text x="39" y="143">Biblioteca</text>
    <text x="39" y="196">de prompts<tspan fill="#ff701a">.</tspan></text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#fff4e8" opacity=".65">
    <text x="43" y="239">Encontre uma ideia.</text>
    <text x="43" y="264">Dê o seu próximo passo.</text>
  </g>
  <g transform="translate(533 57) rotate(-10 155 153)">
    <rect x="11" y="14" width="306" height="310" fill="#101014" opacity=".25"/>
    <rect width="306" height="310" fill="#28282e" stroke="#fff4e8" stroke-opacity=".25"/>
    <text x="23" y="33" font-family="Inter, Arial, sans-serif" font-size="10" fill="#fff4e8" opacity=".75" letter-spacing="1.6">DIREÇÃO CRIATIVA</text>
    <path d="M23 49H283" stroke="#fff4e8" stroke-opacity=".2"/>
  </g>
  <g transform="translate(570 77) rotate(6 150 151)">
    <rect x="12" y="16" width="298" height="305" fill="#101014" opacity=".35"/>
    <rect width="298" height="305" fill="#fff4e8"/>
    <rect width="298" height="7" fill="#101014"/>
    <text x="25" y="43" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#101014" letter-spacing="1.6">PROMPT / 001</text>
    <g font-family="Montserrat, Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#101014" letter-spacing="-.7">
      <text x="25" y="99">O começo de</text>
      <text x="25" y="133">uma boa ideia.</text>
    </g>
    <path d="M25 157H271" stroke="#101014" stroke-opacity=".2"/>
    <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#101014" opacity=".65">
      <text x="25" y="189">[ contexto ]</text><text x="25" y="212">[ intenção ]</text><text x="25" y="235">[ direção ]</text>
    </g>
    <path d="m246 261 11 11-11 11m-15-11h26" fill="none" stroke="#101014" stroke-width="2.5"/>
  </g>
  <circle cx="47" cy="372" r="3.5" fill="#ff701a"/>
  <text x="61" y="376" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff4e8" letter-spacing="1.7">ACERVO CRIATIVO / ACESSO LIVRE</text>
</svg>
