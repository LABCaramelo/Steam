<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Biblioteca de prompts</title>
  <desc id="desc">Capa editorial em preto, creme e laranja. Cartões de prompts empilhados representam um acervo criativo de acesso livre do Um Cara Caramelo.</desc>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff4e8" opacity=".13"/></pattern>
    <pattern id="lines" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#fff4e8" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="600" height="900" fill="#101014"/>
  <rect width="600" height="900" fill="url(#lines)"/>
  <path d="M600 340 418 490V900H600Z" fill="#ff701a"/>
  <path d="M600 414 470 522V900H600Z" fill="url(#dots)"/>
  <g fill="#fff4e8" font-family="Montserrat, Inter, Arial, sans-serif" font-weight="900">
    <text x="46" y="60" font-size="17" letter-spacing=".4">UM CARA</text>
    <text x="46" y="79" font-size="17" letter-spacing=".1">CARAMELO</text>
  </g>
  <rect x="461" y="43" width="93" height="34" fill="none" stroke="#ff701a"/>
  <text x="507" y="65" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ff701a" letter-spacing="1.4">LAB / 01</text>
  <path d="M46 112H554" stroke="#fff4e8" stroke-opacity=".22"/>
  <text x="46" y="161" font-family="Inter, Arial, sans-serif" font-size="12" fill="#ff701a" font-weight="700" letter-spacing="2.1">ACERVO CRIATIVO</text>
  <g fill="#fff4e8" font-family="Montserrat, Inter, Arial, sans-serif" font-size="61" font-weight="900" letter-spacing="-2.5">
    <text x="41" y="236">Biblioteca</text>
    <text x="41" y="300">de prompts<tspan fill="#ff701a">.</tspan></text>
  </g>
  <text x="46" y="349" font-family="Inter, Arial, sans-serif" font-size="17" fill="#fff4e8" opacity=".66">Ideias prontas para ganhar forma.</text>
  <g transform="translate(62 444) rotate(-8 223 159)">
    <rect x="25" y="27" width="426" height="302" fill="#101014" opacity=".75"/>
    <rect x="0" y="0" width="426" height="302" fill="#25252b" stroke="#fff4e8" stroke-opacity=".25"/>
    <path d="M25 34H401M25 270H401" stroke="#fff4e8" stroke-opacity=".12"/>
    <text x="25" y="25" fill="#fff4e8" opacity=".65" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="10" letter-spacing="2">DIREÇÃO CRIATIVA</text>
  </g>
  <g transform="translate(92 450) rotate(5 216 155)">
    <rect x="14" y="18" width="408" height="310" fill="#101014" opacity=".5"/>
    <rect width="408" height="310" fill="#fff4e8"/>
    <rect x="0" y="0" width="408" height="8" fill="#ff701a"/>
    <g font-family="Inter, Arial, sans-serif" fill="#101014">
      <text x="26" y="48" font-size="11" font-weight="700" letter-spacing="2">PROMPT / 001</text>
      <text x="26" y="95" font-size="24" font-weight="800">Uma ideia começa</text>
      <text x="26" y="126" font-size="24" font-weight="800">com uma boa pergunta.</text>
      <text x="26" y="173" font-size="13" opacity=".66">Contexto. Intenção. Direção.</text>
      <path d="M26 195H378" stroke="#101014" stroke-opacity=".2"/>
      <text x="26" y="224" font-size="12" opacity=".72">[ descreva o que você quer criar ]</text>
      <text x="26" y="270" font-size="11" font-weight="700" letter-spacing="1.2">EXPLORE. ADAPTE. CRIE.</text>
    </g>
    <path d="m350 257 12 12-12 12m-17-12h28" fill="none" stroke="#101014" stroke-width="2.5"/>
  </g>
  <path d="M47 821H553" stroke="#fff4e8" stroke-opacity=".25"/>
  <circle cx="52" cy="853" r="4" fill="#ff701a"/>
  <text x="67" y="857" font-family="Inter, Arial, sans-serif" font-size="12" fill="#fff4e8" font-weight="700" letter-spacing="1.8">ACESSO LIVRE</text>
  <text x="553" y="857" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12" fill="#101014" font-weight="700">01 / LAB</text>
</svg>
