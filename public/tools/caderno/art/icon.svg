<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="112" fill="#101014"/>
  <!-- Decorative Grid & Flow lines -->
  <circle cx="256" cy="256" r="180" stroke="#FF701A" stroke-width="4" stroke-dasharray="10 10" opacity="0.25"/>
  <rect x="110" y="90" width="292" height="332" rx="28" fill="#181820" stroke="#252530" stroke-width="3"/>
  <!-- Document spine / binder dots -->
  <line x1="160" y1="90" x2="160" y2="422" stroke="#FF701A" stroke-width="3" opacity="0.7"/>
  <circle cx="135" cy="150" r="10" fill="#FF701A"/>
  <circle cx="135" cy="256" r="10" fill="#25BFFF"/>
  <circle cx="135" cy="360" r="10" fill="#FF3D8D"/>
  
  <!-- Blocks on page -->
  <!-- Header block -->
  <rect x="185" y="140" width="170" height="20" rx="6" fill="#FFF4E8"/>
  <rect x="185" y="175" width="90" height="10" rx="5" fill="#FF701A"/>
  
  <!-- Checkbox block -->
  <rect x="185" y="215" width="22" height="22" rx="6" stroke="#25BFFF" stroke-width="3" fill="#14141A"/>
  <path d="M190 226L195 231L203 221" stroke="#25BFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="220" y="221" width="150" height="10" rx="5" fill="#FFF4E8" opacity="0.6"/>
  
  <!-- Database grid block -->
  <rect x="185" y="260" width="185" height="90" rx="12" fill="#1F1F2A" stroke="#7657FF" stroke-width="2"/>
  <line x1="185" y1="288" x2="370" y2="288" stroke="#7657FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="245" y1="260" x2="245" y2="350" stroke="#7657FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="305" y1="260" x2="305" y2="350" stroke="#7657FF" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Cell tags -->
  <rect x="195" y="298" width="40" height="12" rx="6" fill="#FF701A" opacity="0.8"/>
  <rect x="255" y="298" width="38" height="12" rx="6" fill="#25BFFF" opacity="0.8"/>
  <rect x="315" y="298" width="44" height="12" rx="6" fill="#FFD52A" opacity="0.8"/>

  <!-- Slash command indicator -->
  <circle cx="365" cy="370" r="28" fill="#FF701A"/>
  <text x="365" y="380" text-anchor="middle" fill="#101014" font-family="monospace" font-size="28" font-weight="900">/</text>
</svg>