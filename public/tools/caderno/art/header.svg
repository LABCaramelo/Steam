<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" fill="none">
  <rect width="920" height="430" fill="#101014"/>
  <defs>
    <radialGradient id="cadHdrGlow" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF701A" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#7657FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#101014" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="920" height="430" fill="url(#cadHdrGlow)"/>

  <!-- Left Text -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="145" height="28" rx="14" fill="#181820" stroke="#FF701A" stroke-width="1.5"/>
    <text x="72" y="18" text-anchor="middle" fill="#FF701A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="2">APPFLOWY CORE</text>
    <text x="0" y="80" fill="#FFF4E8" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">CADERNO</text>
    <text x="0" y="125" fill="#FF701A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Segundo cérebro, blocos e bases de dados.</text>
    <text x="0" y="160" fill="#FFF4E8" opacity="0.65" font-family="system-ui, -apple-system, sans-serif" font-size="14">Documentos com comandos de barra (/), Kanban, Tabelas e Wikis integradas</text>
  </g>

  <!-- Right Visual Stack -->
  <g transform="translate(600, 60)">
    <!-- Back card (Kanban) -->
    <rect x="40" y="30" width="220" height="290" rx="16" fill="#25BFFF" opacity="0.2" transform="rotate(-6 150 175)"/>
    <!-- Middle card -->
    <rect x="30" y="20" width="220" height="290" rx="16" fill="#7657FF" opacity="0.25" transform="rotate(4 140 165)"/>
    <!-- Top card (Document) -->
    <rect x="20" y="10" width="230" height="300" rx="18" fill="#181822" stroke="#FF701A" stroke-width="2.5"/>
    
    <!-- Spine dots -->
    <circle cx="40" cy="50" r="5" fill="#FF701A"/>
    <circle cx="40" cy="150" r="5" fill="#25BFFF"/>
    <circle cx="40" cy="250" r="5" fill="#FF3D8D"/>
    <line x1="55" y1="15" x2="55" y2="305" stroke="#282835" stroke-width="1.5"/>

    <!-- Document simulation -->
    <rect x="70" y="45" width="130" height="14" rx="4" fill="#FFF4E8"/>
    <rect x="70" y="70" width="70" height="7" rx="3.5" fill="#FF701A"/>
    
    <!-- Tasks -->
    <rect x="70" y="95" width="14" height="14" rx="4" stroke="#25BFFF" stroke-width="2" fill="#14141A"/>
    <path d="M73 102L77 106L81 99" stroke="#25BFFF" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="92" y="99" width="100" height="6" rx="3" fill="#FFF4E8" opacity="0.8"/>

    <rect x="70" y="120" width="14" height="14" rx="4" stroke="#454555" stroke-width="2" fill="#14141A"/>
    <rect x="92" y="124" width="80" height="6" rx="3" fill="#FFF4E8" opacity="0.5"/>

    <!-- Callout -->
    <rect x="70" y="145" width="160" height="42" rx="8" fill="#20202E" stroke="#7657FF" stroke-width="1.2"/>
    <circle cx="85" cy="166" r="8" fill="#7657FF" opacity="0.3"/>
    <text x="85" y="169" text-anchor="middle" font-size="10">💡</text>
    <rect x="100" y="158" width="115" height="5" rx="2.5" fill="#FFF4E8" opacity="0.8"/>
    <rect x="100" y="168" width="75" height="5" rx="2.5" fill="#FFF4E8" opacity="0.5"/>

    <!-- Database preview -->
    <rect x="70" y="200" width="160" height="75" rx="6" fill="#14141A" stroke="#353545" stroke-width="1"/>
    <line x1="70" y1="222" x2="230" y2="222" stroke="#353545" stroke-width="1"/>
    <rect x="78" y="232" width="30" height="8" rx="4" fill="#FF701A"/>
    <rect x="120" y="232" width="30" height="8" rx="4" fill="#25BFFF"/>
    <rect x="162" y="232" width="30" height="8" rx="4" fill="#FFD52A"/>
    
    <rect x="78" y="250" width="34" height="8" rx="4" fill="#7657FF"/>
    <rect x="120" y="250" width="28" height="8" rx="4" fill="#FF3D8D"/>
    <rect x="162" y="250" width="32" height="8" rx="4" fill="#25BFFF"/>

    <!-- Slash float -->
    <circle cx="215" cy="275" r="20" fill="#FF701A"/>
    <text x="215" y="283" text-anchor="middle" fill="#101014" font-family="monospace" font-size="22" font-weight="900">/</text>
  </g>
</svg>