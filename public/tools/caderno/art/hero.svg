<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 620" fill="none">
  <rect width="1920" height="620" fill="#101014"/>
  <defs>
    <radialGradient id="cadHeroGlow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF701A" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#7657FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#101014" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="620" fill="url(#cadHeroGlow)"/>

  <!-- Left info -->
  <g transform="translate(140, 150)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#181820" stroke="#FF701A" stroke-width="1.5"/>
    <text x="110" y="21" text-anchor="middle" fill="#FF701A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">APPFLOWY NO LAB</text>
    <text x="0" y="110" fill="#FFF4E8" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">CADERNO</text>
    <text x="0" y="165" fill="#FF701A" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Seu segundo cérebro em blocos, bases relacionais e wikis.</text>
    <text x="0" y="215" fill="#FFF4E8" opacity="0.65" font-family="system-ui, -apple-system, sans-serif" font-size="16">Comandos rápidos (/) · Quadros Kanban e Tabelas Grid · Árvore infinita de páginas · 100% offline-ready</text>
  </g>

  <!-- Right Visual Elements -->
  <g transform="translate(1180, 60)">
    <!-- Kanban layer behind -->
    <rect x="90" y="60" width="340" height="460" rx="24" fill="#25BFFF" opacity="0.22" transform="rotate(-8 260 290)"/>
    <!-- Notes layer -->
    <rect x="70" y="40" width="340" height="460" rx="24" fill="#7657FF" opacity="0.28" transform="rotate(7 240 270)"/>
    <!-- Main interactive surface -->
    <rect x="80" y="25" width="350" height="470" rx="24" fill="#16161E" stroke="#FF701A" stroke-width="3"/>
    
    <!-- Sidebar column simulation -->
    <rect x="80" y="25" width="90" height="470" rx="24" fill="#121217"/>
    <rect x="95" y="55" width="60" height="8" rx="4" fill="#FF701A"/>
    <rect x="95" y="80" width="50" height="6" rx="3" fill="#FFF4E8" opacity="0.7"/>
    <rect x="95" y="105" width="55" height="6" rx="3" fill="#FFF4E8" opacity="0.5"/>
    <rect x="95" y="130" width="45" height="6" rx="3" fill="#FFF4E8" opacity="0.5"/>
    <rect x="95" y="155" width="50" height="6" rx="3" fill="#FFF4E8" opacity="0.5"/>
    <line x1="170" y1="25" x2="170" y2="495" stroke="#252530" stroke-width="1.5"/>

    <!-- Document simulation -->
    <rect x="195" y="60" width="180" height="20" rx="5" fill="#FFF4E8"/>
    <rect x="195" y="95" width="90" height="8" rx="4" fill="#FF701A"/>

    <!-- Checklist -->
    <rect x="195" y="125" width="18" height="18" rx="4" stroke="#25BFFF" stroke-width="2" fill="#14141A"/>
    <path d="M199 134L204 139L209 130" stroke="#25BFFF" stroke-width="2" stroke-linecap="round"/>
    <rect x="225" y="130" width="160" height="8" rx="4" fill="#FFF4E8" opacity="0.8"/>

    <rect x="195" y="155" width="18" height="18" rx="4" stroke="#404050" stroke-width="2" fill="#14141A"/>
    <rect x="225" y="160" width="130" height="8" rx="4" fill="#FFF4E8" opacity="0.5"/>

    <!-- Callout container -->
    <rect x="195" y="190" width="205" height="55" rx="10" fill="#20202E" stroke="#7657FF" stroke-width="1.5"/>
    <circle cx="218" cy="217" r="12" fill="#7657FF" opacity="0.3"/>
    <text x="218" y="222" text-anchor="middle" font-size="14">💡</text>
    <rect x="240" y="206" width="145" height="8" rx="4" fill="#FFF4E8" opacity="0.9"/>
    <rect x="240" y="222" width="95" height="7" rx="3.5" fill="#FFF4E8" opacity="0.5"/>

    <!-- Database Grid simulation -->
    <rect x="195" y="265" width="205" height="135" rx="10" fill="#121218" stroke="#353545" stroke-width="1.5"/>
    <line x1="195" y1="300" x2="400" y2="300" stroke="#353545" stroke-width="1"/>
    
    <!-- Table columns -->
    <rect x="208" y="315" width="45" height="14" rx="7" fill="#FF701A"/>
    <rect x="265" y="315" width="50" height="14" rx="7" fill="#25BFFF"/>
    <rect x="328" y="315" width="55" height="14" rx="7" fill="#FFD52A"/>

    <rect x="208" y="340" width="50" height="14" rx="7" fill="#7657FF"/>
    <rect x="265" y="340" width="45" height="14" rx="7" fill="#FF3D8D"/>
    <rect x="328" y="340" width="48" height="14" rx="7" fill="#25BFFF"/>

    <rect x="208" y="365" width="40" height="14" rx="7" fill="#FF701A"/>
    <rect x="265" y="365" width="55" height="14" rx="7" fill="#7657FF"/>
    <rect x="328" y="365" width="42" height="14" rx="7" fill="#FFD52A"/>

    <!-- Floating Slash badge -->
    <circle cx="390" cy="420" r="32" fill="#FF701A" filter="drop-shadow(0 6px 16px rgba(255,112,26,0.5))"/>
    <text x="390" y="432" text-anchor="middle" fill="#101014" font-family="monospace" font-size="34" font-weight="900">/</text>
  </g>
</svg>