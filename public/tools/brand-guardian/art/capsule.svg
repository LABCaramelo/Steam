<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Brand Guardian — Um Cara Caramelo</title>
  <desc id="desc">IDENTIDADE &amp; DESIGN SYSTEM. A fonte oficial de cada marca no LAB.</desc>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFF4E8" opacity=".07"/>
    </pattern>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF701A"/>
      <stop offset="100%" stop-color="#FF3D8D"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="#101014"/>
  <rect width="600" height="900" fill="url(#dots)"/>
  <path d="M456 0H600V900H570Z" fill="#FF701A" fill-opacity=".12"/>
  <path d="M44 245H555" stroke="#FFF4E8" stroke-opacity=".18"/>
  <g font-family="Montserrat, Inter, Arial, sans-serif">
    <text x="44" y="70" fill="#FF701A" font-size="11" font-weight="700" letter-spacing="3">LAB / 19</text>
    <text x="40" y="150" fill="#FFF4E8" font-size="58" font-weight="900" letter-spacing="-2">Brand</text>
    <text x="40" y="208" fill="#FFF4E8" font-size="58" font-weight="900" letter-spacing="-2">Guardian<tspan fill="#FF701A">.</tspan></text>
    <text x="44" y="235" fill="#FFF4E8" fill-opacity=".6" font-size="11" letter-spacing="2">IDENTIDADE &amp; DESIGN SYSTEM</text>
    
    <!-- Central Guardian Shield & Palette Composition -->
    <g transform="translate(150 330)">
      <!-- Outer Shield Glow -->
      <path d="M150 40 L260 80 V190 C260 270 150 330 150 330 C150 330 40 270 40 190 V80 Z" fill="#1E1E26" stroke="#FFF4E8" stroke-opacity=".15" stroke-width="2"/>
      <path d="M150 60 L240 95 V185 C240 250 150 305 150 305 C150 305 60 250 60 185 V95 Z" fill="#101014" stroke="url(#shieldGrad)" stroke-width="3"/>
      
      <!-- Color Wheel / Spectrum Swatches inside Shield -->
      <circle cx="150" cy="180" r="50" fill="none" stroke="#25BFFF" stroke-width="8" stroke-dasharray="78 236"/>
      <circle cx="150" cy="180" r="50" fill="none" stroke="#FF701A" stroke-width="8" stroke-dasharray="78 236" stroke-dashoffset="-78"/>
      <circle cx="150" cy="180" r="50" fill="none" stroke="#FF3D8D" stroke-width="8" stroke-dasharray="78 236" stroke-dashoffset="-156"/>
      <circle cx="150" cy="180" r="50" fill="none" stroke="#FFD52A" stroke-width="8" stroke-dasharray="78 236" stroke-dashoffset="-234"/>
      
      <!-- Central Isotype Symbol -->
      <circle cx="150" cy="180" r="28" fill="#FFF4E8"/>
      <circle cx="150" cy="180" r="14" fill="#FF701A"/>
      <circle cx="150" cy="180" r="6" fill="#101014"/>
      
      <!-- Token connection nodes -->
      <circle cx="60" cy="95" r="5" fill="#25BFFF"/>
      <circle cx="240" cy="95" r="5" fill="#FF701A"/>
      <circle cx="150" cy="305" r="5" fill="#FF3D8D"/>
    </g>

    <!-- Color chips underneath -->
    <g transform="translate(90 690)">
      <rect x="0" y="0" width="55" height="24" rx="4" fill="#101014" stroke="#FFF4E8" stroke-opacity=".3"/>
      <rect x="65" y="0" width="55" height="24" rx="4" fill="#FFF4E8"/>
      <rect x="130" y="0" width="55" height="24" rx="4" fill="#FF701A"/>
      <rect x="195" y="0" width="55" height="24" rx="4" fill="#25BFFF"/>
      <rect x="260" y="0" width="55" height="24" rx="4" fill="#FF3D8D"/>
      <rect x="325" y="0" width="55" height="24" rx="4" fill="#FFD52A"/>
      <rect x="390" y="0" width="30" height="24" rx="4" fill="#7657FF"/>
    </g>

    <text x="44" y="790" fill="#FFF4E8" font-size="28" font-weight="800" letter-spacing="-.7">A fonte da verdade</text>
    <text x="44" y="828" fill="#FF701A" font-size="28" font-weight="800" letter-spacing="-.7">de cada marca no LAB.</text>
    <text x="44" y="875" fill="#FFF4E8" fill-opacity=".38" font-size="9" font-weight="700" letter-spacing="2">UM CARA CARAMELO®</text>
  </g>
</svg>
