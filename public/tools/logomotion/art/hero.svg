    <text x="0" y="200" fill="#FFF4E8" opacity="0.65" font-family="system-ui, -apple-system, sans-serif" font-size="16">Cortes sincados no beat · Mockups ultrarrealistas · Exportação vertical 9:16 para Reels e TikTok</text>
