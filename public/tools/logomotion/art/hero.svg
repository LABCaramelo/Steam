      <stop offset="0%" stop-color="#FF701A" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7657FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#101014" stop-opacity="0"/>
