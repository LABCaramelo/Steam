<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salvar no Gabinete</title>
  <style>
    /* Apple Design System (macOS): popover escuro, text fields e push button. */
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background-color: #1E1E1E;
      color: rgba(255, 255, 255, 0.85);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", Inter, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: -0.008em;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .header h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: #F5F5F7;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      background: rgba(255, 146, 48, 0.16);
      color: #FF9230;
      padding: 2px 7px;
      border-radius: 1000px;
    }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 510;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 0;
      box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px 9px;
      color: #F5F5F7;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      box-shadow: inset 0 0 0 0.5px #0091FF, 0 0 0 3.5px rgba(0, 145, 255, 0.45);
    }
    .btn {
      width: 100%;
      background: linear-gradient(180deg, #FF9E33 0%, #FF9230 100%);
      color: #1D1D1F;
      border: none;
      border-radius: 1000px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 590;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 4px 16px rgba(255, 146, 48, 0.28), inset 0 0.5px 0 rgba(255, 255, 255, 0.45);
    }
    .btn:hover {
      filter: brightness(1.06);
    }
    .success {
      display: none;
      background: rgba(48, 209, 88, 0.15);
      color: #30D158;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
      font-weight: 590;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF9230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      Gabinete <span class="badge">EXTENSÃO</span>
    </h2>
    <span style="font-size: 11px; color: rgba(255, 255, 255, 0.35)">LAB 2026</span>
  </div>

  <form id="refForm">
    <div class="field">
      <label>Título da Referência</label>
      <input type="text" id="title" required placeholder="Título do vídeo ou post">
    </div>

    <div class="field">
      <label>Link da Página (detectado)</label>
      <input type="url" id="url" required placeholder="https://...">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div class="field">
        <label>Destino</label>
        <select id="targetType">
          <option value="geral">Geral (Agência)</option>
          <option value="cliente">Cliente Específico</option>
        </select>
      </div>

      <div class="field">
        <label>Categoria</label>
        <select id="category">
          <option value="copy">Copy & Ganchos</option>
          <option value="visual">Direção Visual</option>
          <option value="video">Vídeo & Reels</option>
          <option value="estrategia">Estratégia</option>
        </select>
      </div>
    </div>

    <div class="field" id="clientField" style="display: none;">
      <label>Nome do Cliente</label>
      <input type="text" id="clientName" placeholder="Ex: Graao, Soci...">
    </div>

    <div class="field">
      <label>Por que chamou atenção? (opcional)</label>
      <textarea id="notes" rows="2" placeholder="Gancho, iluminação, ritmo de edição..."></textarea>
    </div>

    <button type="submit" class="btn">Salvar na biblioteca</button>
  </form>

  <div id="successMsg" class="success">
    ✓ Referência salva na Biblioteca!
  </div>

  <script src="popup.js"></script>
</body>
</html>
