<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modo Criador — LAB · Um Cara Caramelo</title>
    <meta name="description" content="Gestão de conteúdo, equipe e entregas para estúdios e agências de social media no LAB Caramelo." />
    <meta name="theme-color" content="#101014" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tema do LAB (ThemeToggle de @caramelo/design-system), aplicado antes da primeira pintura. -->
    <script>try{var t=localStorage.getItem('caramelo-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-caramelo-theme',t)}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tools/modo-criador/main.tsx"></script>
  </body>
</html>
